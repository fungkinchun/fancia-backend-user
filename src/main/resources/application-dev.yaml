server:
  forward-headers-strategy: framework
  servlet:
    context-path: /${REPO_NAME}
spring:
  config:
    import:
      - aws-secretsmanager:${ENV}/${PROJECT_NAME}/redis
      - aws-secretsmanager:${ENV}/${PROJECT_NAME}/s3
      - aws-secretsmanager:${ENV}/${PROJECT_NAME}/kafka
      - aws-secretsmanager:${ENV}/${PROJECT_NAME}/oauth2
      - aws-secretsmanager:${ENV}/${PROJECT_NAME}/gis
      - aws-secretsmanager:${ENV}/${PROJECT_NAME}/streamchat
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVICE_URL:auth-service}
          jwk-set-uri: ${AUTH_SERVICE_URL:auth-service}/oauth2/jwks
  mvc:
    cors:
      mappings:
        "[/**]":
          allowed-origins:
            - "http://localhost:3000"
            - "https://fancia.co.uk"
            - "https://www.fancia.co.uk"
          allowed-methods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
          allowed-headers:
            - Authorization
            - Content-Type
            - Accept
          exposed-headers:
            - Authorization
            - Content-Type
          allow-credentials: true
          max-age: 3600
  datasource:
    url: ${DATABASE_URL}
    username: ${AWS_RDS_SECRET_NAME:${DATABASE_USERNAME}}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER:com.amazonaws.secretsmanager.sql.AWSSecretsManagerPostgreSQLDriver}
    hikari:
      allow-pool-suspension: true
      maximum-pool-size: ${MAX_POOL_SIZE:10}
      minimum-idle: ${MIN_IDLE:10}
      connection-timeout: 10000
      validation-timeout: 5000
      max-lifetime: 480000
      keepalive-time: 120000
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  data:
    redis:
      url: ${REDIS_URL:}
      timeout: 3s
      connect-timeout: 5s
      ssl:
        enabled: true
      lettuce:
        pool:
          enabled: false

  cloud:
    kubernetes:
      discovery:
        enabled: ${KUBERNETES_ENABLED:true}
    openfeign:
      autoconfiguration:
        jackson:
          enabled: true
      client:
        config:
          auth-service:
            url: ${AUTH_SERVICE_URL:#{null}}
          auth-internal-service:
            url: ${AUTH_INTERNAL_SERVICE_URL:#{null}}
          common-service:
            url: ${COMMON_SERVICE_URL:#{null}}
          common-internal-service:
            url: ${COMMON_INTERNAL_SERVICE_URL:#{null}}
          user-service:
            url: ${USER_SERVICE_URL:#{null}}
          user-internal-service:
            url: ${USER_INTERNAL_SERVICE_URL:#{null}}
          interestgroup-service:
            url: ${INTERESTGROUP_SERVICE_URL:#{null}}
          interestgroup-internal-service:
            url: ${INTERESTGROUP_INTERNAL_SERVICE_URL:#{null}}
          event-service:
            url: ${EVENT_SERVICE_URL:#{null}}
          event-internal-service:
            url: ${EVENT_INTERNAL_SERVICE_URL:#{null}}
          payment-internal-service:
            url: ${PAYMENT_INTERNAL_SERVICE_URL:#{null}}
          notification-service:
            url: ${NOTIFICATION_SERVICE_URL:#{null}}
          notification-internal-service:
            url: ${NOTIFICATION_INTERNAL_SERVICE_URL:#{null}}
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.fancia.backend.shared.user.core.message,com.fancia.backend.shared.common.tag.core.message
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:fancia-kafka-fancia.f.aivencloud.com:25067}
    properties:
      security.protocol: SSL
      ssl.truststore.type: PEM
      ssl.keystore.type: PEM
      ssl.truststore.certificates: ${KAFKA_SSL_TRUSTSTORE_CERTIFICATES}
      ssl.keystore.certificate.chain: ${KAFKA_SSL_KEYSTORE_CERTIFICATE_CHAIN}
      ssl.keystore.key: ${KAFKA_SSL_KEYSTORE_KEY}
      auto.register.schemas: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      gis_admin_password: ${GIS_ADMIN_PASSWORD}
app:
  application-name: ${PROJECT_NAME}-backend-${REPO_NAME}
  base-url: ${DOMAIN_NAME}/${REPO_NAME}/api
  login-page-url: ${AUTH_SERVICE_URL:auth-service}/login
  cdn-url: ${CDN_URL:#{null}}
  stream:
    enabled: ${STREAM_ENABLED:false}
    api-key: ${STREAM_API_KEY:}
    api-secret: ${STREAM_API_SECRET:}
    support-image-url: ${STREAM_SUPPORT_IMAGE_URL:}
  s3:
    bucket-name: ${BUCKET_NAME}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true

